title: "B. Fabio Mejías Fernández"
email: "requests@bfab.io"
description: >-
  Employer-facing digital health portfolio by B. Fabio Mejías Fernández:
  clinical software, pharmacovigilance, responsible AI experiments and versioned engineering work.

author:
  name: "B. Fabio Mejías Fernández"
  email: "requests@bfab.io"
  location: "Madrid, European Union"

url: "https://bfab.io"
baseurl: ""
lang: "en"
timezone: "Europe/Madrid"

markdown: kramdown
highlighter: rouge
theme: null

defaults:
  - scope:
      path: ""
    values:
      layout: null

exclude:
  - README.md
  - CHANGELOG.md
  - SECURITY.md
  - app.py
  - Dockerfile
  - render.yaml
  - vercel.json
  - requirements.txt
  - requirements-dev.txt
  - pyproject.toml
  - .python-version
  - tests
  - services
  - supabase
  - scripts
  - docs
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - .vscode
  - package.json
  - package-lock.json
  - "*.pyc"
  - "__pycache__"
  - "_posts"

include:
  - .well-known

portfolio:
  release: "2.0.0"
  domain: "Digital health"
  status: "Employer-facing portfolio"
  location: "Madrid, European Union"
  contact_email: "requests@bfab.io"
  blog_path: "/blog/"
