<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gatito 404</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    .cat-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      filter: contrast(1.05) saturate(1.08);
    }

    .source-loader {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -100vw;
      top: -100vh;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="cat-photo" class="cat-photo" alt="Gatito diseñado para la página 404" />
  <iframe id="source-loader" class="source-loader" src="/source/404-cat-source-original.html" title="Fuente original del gatito 404"></iframe>

  <script>
    const target = document.getElementById('cat-photo');
    const loader = document.getElementById('source-loader');

    loader.addEventListener('load', () => {
      const sourceImage = loader.contentDocument && loader.contentDocument.querySelector('img[src^="data:image"]');
      if (sourceImage && sourceImage.src) {
        target.src = sourceImage.src;
      }
    });
  </script>
</body>
</html>
