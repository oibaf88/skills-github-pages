name: Quality

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read
  pages: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app.py tests

      - name: Compile
        run: python -m compileall -q app.py tests

      - name: Test backend and site links
        run: python -m pytest -q

      - name: Check proxy syntax
        run: node --check services/eudravigilance-proxy/server.js

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Vercel static output
        run: node scripts/build-static-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
